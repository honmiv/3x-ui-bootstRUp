name: Build and Push Caddy L4 Docker Image

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'templates/docker-compose/Dockerfile-caddy-l4'
      - '.github/workflows/docker-caddy-l4.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/caddy-l4

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./templates/docker-compose
          file: ./templates/docker-compose/Dockerfile-caddy-l4
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/caddy-l4:latest
            ghcr.io/${{ github.repository_owner }}/caddy-l4:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
