<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3x-ui bootstRUp documentation</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fb;
      color: #172033;
    }
    main {
      width: min(680px, calc(100% - 32px));
      padding: 36px;
      background: #ffffff;
      border: 1px solid #d9dee7;
      border-radius: 8px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 24px;
      color: #5f6b7a;
    }
    .links {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
      border: 1px solid #cfd6e2;
      border-radius: 8px;
      color: #0d4c40;
      text-decoration: none;
      font-weight: 700;
    }
    .icon {
      width: 24px;
      height: 18px;
      flex: 0 0 auto;
    }
    a:hover { border-color: #166b59; background: #edf7f4; }
    @media (max-width: 560px) {
      main { padding: 24px; }
      .links { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>3x-ui bootstRUp</h1>
    <br/>
    <div class="links">
      <a href="./ru/"><img class="icon" src="https://flagcdn.com/24x18/ru.png" alt=""><span>Русская документация</span></a>
      <a href="./en/"><img class="icon" src="https://flagcdn.com/24x18/gb.png" alt=""><span>English documentation</span></a>
    </div>
    <div style="margin-top: 12px; display: block; width: 100%;">
      <a href="https://github.com/honmiv/3x-ui-bootstRUp" style="display: flex !important; width: 100% !important; justify-content: center !important;"><img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/github.svg" alt=""><span>Source Code</span></a>
    </div>
  </main>
</body>
</html>
